[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "autonomous-spot-trading-agent"
version = "1.0.0"
description = "Simulation-first, constitution-governed BTC/USDT spot trading harness"
requires-python = ">=3.11"
dependencies = ["keyring>=25,<26"]

[project.scripts]
spot-agent = "spot_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
