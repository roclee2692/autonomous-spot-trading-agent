name: research-longhist

# Long (10-15 year) daily histories from Bitstamp / Bitfinex / Coinbase /
# CryptoCompare for the long-horizon study. Manual or on changes to the fetcher.
on:
  workflow_dispatch:
  push:
    paths:
      - research/fetch_long/**
      - .github/workflows/research-longhist.yml

permissions:
  contents: write

concurrency:
  group: research-longhist-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests==2.32.3
      - run: python research/fetch_long/fetch_longhist.py
      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/data/long
          git commit -m "data: long-history daily OHLC for the long-horizon study" || exit 0
          git pull --rebase origin ${{ github.ref_name }} || true
          git push origin HEAD:${{ github.ref_name }}
