name: research-data

# Fetches Binance public kline archives for the strategy research and commits
# them to the branch that triggered the run. Manual or on changes to the fetcher.
on:
  workflow_dispatch:
  push:
    paths:
      - research/fetch/**
      - .github/workflows/research-data.yml

permissions:
  contents: write

concurrency:
  group: research-data-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests==2.32.3
      - run: python research/fetch/fetch_binance.py
      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/data
          git commit -m "data: refresh Binance klines for strategy research" || exit 0
          git push origin HEAD:${{ github.ref_name }}
